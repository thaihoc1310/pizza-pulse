apiVersion: apps/v1
kind: Deployment
metadata:
  name: pp-dashboard
  namespace: pizza-pulse
  labels:
    app.kubernetes.io/name: pp-dashboard
    app.kubernetes.io/part-of: pizza-pulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pp-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pp-dashboard
        app.kubernetes.io/part-of: pizza-pulse
    spec:
      containers:
        - name: dashboard
          image: thaihoc285/pp-dashboard:0.0.1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: POSTGRES_HOST
              value: pp-postgre-postgresql
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: pizza_serving
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pp-postgre-postgresql
                  key: postgres-password
            - name: DASHBOARD_REFRESH_SECONDS
              value: "5"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pp-dashboard
  namespace: pizza-pulse
  labels:
    app.kubernetes.io/name: pp-dashboard
    app.kubernetes.io/part-of: pizza-pulse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pp-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http

