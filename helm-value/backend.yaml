apiVersion: apps/v1
kind: Deployment
metadata:
  name: pp-backend
  namespace: pizza-pulse
  labels:
    app.kubernetes.io/name: pp-backend
    app.kubernetes.io/part-of: pizza-pulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pp-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pp-backend
        app.kubernetes.io/part-of: pizza-pulse
    spec:
      containers:
        - name: backend
          image: manhhung1685/pp-backend:0.0.1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: pp-kafka-kafka-bootstrap:9092
            - name: KAFKA_ORDER_TOPIC
              value: pp.order.events
            - name: POSTGRES_WRITE_ENABLED
              value: "false"
            - name: POSTGRES_HOST
              value: pp-postgre-postgresql
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: pizza_serving
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pp-postgre-postgresql
                  key: postgres-password
            - name: ORDER_TIMEZONE
              value: Asia/Ho_Chi_Minh
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pp-backend
  namespace: pizza-pulse
  labels:
    app.kubernetes.io/name: pp-backend
    app.kubernetes.io/part-of: pizza-pulse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pp-backend
  ports:
    - name: http
      port: 80
      targetPort: http
