apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: "bootstrap-pizza-db-{{ ts_nodash | lower }}"
  namespace: pizza-pulse
spec:
  type: Python
  mode: cluster

  image: thaihoc285/ppbootstrap-pizza-db:0.0.1
  imagePullPolicy: Always

  mainApplicationFile: local:///opt/spark/jobs/bootstrap_pizza_db.py
  sparkVersion: "3.5.0"

  restartPolicy:
    type: Never

  sparkConf:
    spark.kubernetes.executor.deleteOnTermination: "false"

  driver:
    cores: 1
    memory: "1g"
    serviceAccount: pp-spark-operator-spark
    env:
      - name: POSTGRES_HOST
        value: pp-postgre-postgresql
      - name: POSTGRES_PORT
        value: "5432"
      - name: POSTGRES_DB
        value: pizza_serving
      - name: POSTGRES_USER
        value: postgres
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: pp-postgre-postgresql
            key: postgres-password

      - name: MINIO_ENDPOINT
        value: http://pp-minio:9000
      - name: MINIO_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: pp-airflow-minio
            key: AWS_ACCESS_KEY_ID
      - name: MINIO_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: pp-airflow-minio
            key: AWS_SECRET_ACCESS_KEY

      - name: INPUT_PATH
        value: s3a://pp-lakehouse/bronze/raw/pizza_sales.csv

  executor:
    instances: 2
    cores: 1
    memory: "1g"
    env:
      - name: POSTGRES_HOST
        value: pp-postgre-postgresql
      - name: POSTGRES_PORT
        value: "5432"
      - name: POSTGRES_DB
        value: pizza_serving
      - name: POSTGRES_USER
        value: postgres
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: pp-postgre-postgresql
            key: postgres-password

      - name: MINIO_ENDPOINT
        value: http://pp-minio:9000
      - name: MINIO_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: pp-airflow-minio
            key: AWS_ACCESS_KEY_ID
      - name: MINIO_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: pp-airflow-minio
            key: AWS_SECRET_ACCESS_KEY
